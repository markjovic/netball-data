 main.innerHTML=`
 <div class="seg"><button data-net="HIGH" class="${state.net==='HIGH'?'on':''}">Full-height nets</button><button data-net="LOW" class="${state.net==='LOW'?'on':''}">Lowered nets</button></div>
 <div class="note"><b>Strength ladder — ${state.net==='HIGH'?'full-height':'lowered'} nets only.</b> Teams are ranked by an opponent-adjusted rating from games played at this net height (so scores are like-for-like), beating strong teams counts more than padding weak ones, and close teams break on head-to-head then common opponents. A team that played at both heights appears on both ladders.</div>
 <div class="card"><h3>${state.net==='HIGH'?'Full-height':'Lowered'} net ladder · ${esc(d.label)}</h3>
 <table><thead><tr><th class="rank">#</th><th class="al">Team</th><th>Rtg</th><th>P</th><th>W-L</th><th>GD</th></tr></thead>
 <tbody>${L.map(r=>`<tr class="clk" data-team="${esc(r.team)}"><td class="rank">${r.rank}</td><td class="al tn">${dn(r.team)}${arrows(r)}</td><td class="rating">${r.rating.toFixed(2)}</td><td>${r.P}</td><td class="rec">${r.W}-${r.L}${r.D?'-'+r.D:''}</td><td class="gd ${r.GD>=0?'pos':'neg'}">${r.GD>0?'+':''}${r.GD}</td></tr>`).join('')}</tbody></table></div>`;
 document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{state.net=b.dataset.net;render();});
 bindTeam();
}
function ladderTable(rows){return `<table><thead><tr><th class="rank">#</th><th class="al">Team</th><th>P</th><th>W</th><th>L</th><th>PF</th><th>PA</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="clk" data-team="${esc(r.team)}"><td class="rank">${i+1}</td><td class="al tn">${dn(r.team)}</td><td>${r.P}</td><td class="cw">${r.W}</td><td class="cl">${r.L}</td><td>${r.PF}</td><td>${r.PA}</td></tr>`).join('')}</tbody></table>`;}
function renderGrades(d){
 let h=`<div class="note">${d.ongoing?'Current':'Final'} grades, strongest first. ${d.colourNamed?'Names are the competition colours.':'Finished season — grades labelled by strength.'} Each shows its net height. Tap to expand.</div>`;
 d.gradesView.forEach((g,i)=>{h+=`<div class="card"><h3 class="gh${i===0?' open':''}">${gchip(g.label)} ${netchip(g.net)}<span class="arw">▸</span></h3><div class="gb${i===0?' open':''}">${ladderTable(g.ladder)}</div></div>`;});
 main.innerHTML=h;
 document.querySelectorAll('.gh').forEach(x=>x.onclick=()=>{x.classList.toggle('open');x.nextElementSibling.classList.toggle('open');});
 bindTeam();
}
function renderPhases(d){
 let h=`<div class="note">Each grading <b>period</b> in order, with every pool's ladder for games in that period. This is how teams were graded and re-graded. ${d.ongoing?'The last period is the current grading.':''}</div>`;
 d.periodsView.forEach(p=>{
  h+=`<div style="margin:6px 2px 8px;font-weight:700">${esc(p.label)} <span class="muted tiny" style="font-weight:400">· ${p.dateFrom.slice(5)} → ${p.dateTo.slice(5)}</span></div>`;
  p.pools.forEach(pool=>{h+=`<div class="card"><h3>${gchip(pool.label)} ${netchip(pool.net)}</h3>${ladderTable(pool.ladder)}</div>`;});
 });
 main.innerHTML=h;bindTeam();
}
function renderTeams(d){
 const byg={};
 if(state.tg==='grade'){d.gradesView.forEach(g=>byg[g.label]=[]);Object.entries(d.teams).forEach(([n,t])=>{(byg[t.currentGrade]=byg[t.currentGrade]||[]).push(n);});}
 else{Object.keys(d.teams).forEach(n=>{const c=club(n);(byg[c]=byg[c]||[]).push(n);});}
 const keys=state.tg==='grade'?d.gradesView.map(g=>g.label):Object.keys(byg).sort();
 let h=`<div class="seg"><button data-tg="club" class="${state.tg==='club'?'on':''}">By club</button><button data-tg="grade" class="${state.tg==='grade'?'on':''}">By grade</button></div>`;
 keys.forEach(k=>{const ns=(byg[k]||[]).sort();if(!ns.length)return;
  const head=state.tg==='grade'?gchip(k):`<span>${esc(k)}</span>`;
  h+=`<div class="card"><h3>${head}<span class="muted tiny">${ns.length}</span></h3>${ns.map(n=>`<div class="g" data-team="${esc(n)}"><span class="tn">${dn(n)}</span> ${state.tg==='club'?gchip(d.teams[n].currentGrade)+' '+netchip(d.teams[n].currentNet):''}</div>`).join('')}</div>`;});
 main.innerHTML=h;
 document.querySelectorAll('.seg button[data-tg]').forEach(x=>x.onclick=()=>{state.tg=x.dataset.tg;renderTeams(d);});
 bindTeam();
}
function renderSearch(d){
 const q=state.q.toLowerCase(),hits=Object.keys(d.teams).filter(n=>n.toLowerCase().includes(q)).sort();
 main.innerHTML=`<div class="card"><h3>Search · "${esc(state.q)}"</h3>${hits.length?hits.map(n=>`<div class="g" data-team="${esc(n)}"><span class="tn">${dn(n)}</span> ${gchip(d.teams[n].currentGrade)}</div>`).join(''):'<div class="empty">No teams match.</div>'}</div>`;
 bindTeam();
}
function renderTeam(d,name){
 const t=d.teams[name];if(!t){state.team=null;return render();}
 const jr=t.journey.map(j=>`<span>${gchip(j.pool)} ${netchip(j.net)} <span class="muted tiny">${j.W}-${j.L}${j.D?'-'+j.D:''}</span></span>`).join(' <span class="jarrow">→</span> ');
 const ranks=[];
 if(t.highRank)ranks.push(`Full-net #${t.highRank} (${t.highRating.toFixed(2)})`);
 if(t.lowRank)ranks.push(`Low-net #${t.lowRank} (${t.lowRating.toFixed(2)})`);
 const phs=[...new Set(t.games.map(g=>g.period))];
 const gl=phs.map(ph=>{
  const gs=t.games.filter(g=>g.period===ph);const w=gs.filter(g=>g.res==='W').length,l=gs.filter(g=>g.res==='L').length,dd=gs.filter(g=>g.res==='D').length;
  const net=gs[0]?gs[0].net:null;
  const rows=gs.map(g=>{const q=d.periods[g.mid];let qb='';const qid='qb'+g.mid;
   if(q){const isT1=q.t1===name;qb=`<div class="qbreak" id="${qid}">`+q.delta.map((dl,qi)=>{const f=isT1?dl[0]:dl[1],a=isT1?dl[1]:dl[0];return `<span class="q">Q${qi+1} ${f}-${a}</span>`;}).join('')+`</div>`;}
   return `<div class="g" data-qb="${qid}"><span class="gdate">${g.date.slice(5)}</span><span class="rbadge ${g.res}">${g.res}</span><span class="gopp">${dn(g.opp)}</span><span class="gsc">${g.for}–${g.against}</span></div>${qb}`;}).join('');
  return `<div class="grade-sub">${esc(ph)} ${netchip(net)} <span style="margin-left:auto;color:var(--text2)">${w}-${l}${dd?'-'+dd:''}</span></div>${rows}`;
 }).join('');
 main.innerHTML=`<button class="back" onclick="go({team:null})">← back</button>
 <div class="thdr"><div class="avi">${initials(name)}</div><div><div class="tbig">${dn(name)}</div><div class="tiny muted">${d.ongoing?'Current':'Final'} grade ${gchip(t.currentGrade)} ${netchip(t.currentNet)}</div></div></div>
 <div class="statrow"><div class="stat"><div class="v">${t.W}-${t.L}${t.D?'-'+t.D:''}</div><div class="k">Record</div></div><div class="stat"><div class="v">${t.PF}</div><div class="k">For</div></div><div class="stat"><div class="v">${t.PA}</div><div class="k">Against</div></div></div>
 <div class="note" style="margin-top:12px">Strength ranking: ${ranks.join(' · ')||'—'}. Ladders are separate for full-height and lowered nets because scores aren't comparable across them.</div>
 <div class="card"><h3>Regrade journey</h3><div class="jrow">${jr||'<span class="muted">—</span>'}</div></div>
 <div class="card"><h3>Season games <span class="muted tiny">· tap for per-quarter</span></h3>${gl||'<div class="empty">No games.</div>'}</div>`;
 document.querySelectorAll('.card .g[data-qb]').forEach(el=>{const q=document.getElementById(el.dataset.qb);if(q)el.onclick=()=>q.classList.toggle('show');});
}
function tg(d,nm){return (d.teams[nm]||{}).currentGrade;}
function flowHiSet(d){
 if(!state.flowHi)return null;
 const[k,v]=[state.flowHi.slice(0,state.flowHi.indexOf(':')),state.flowHi.slice(state.flowHi.indexOf(':')+1)];
 if(k==='team')return new Set([v]);
 if(k==='club')return new Set(Object.keys(d.teams).filter(n=>club(n)===v));
 if(k==='node'){const nd=d.flow.columns.flatMap(c=>c.nodes).find(x=>x.id===v);return nd?new Set(nd.teams):null;}
 return null;
}
function renderFlow(d){
 const F=d.flow,cols=F.columns,nc=cols.length;
 const ROWH=16,NW=52,NODEGAP=18,PADX=18,TOP=44;
 const avail=Math.max(300,(main.clientWidth||620)-32),minGap=120;
 const W=Math.max(avail,PADX*2+NW+(nc-1)*minGap),COLGAP=(W-PADX*2-NW)/(nc-1);
 const gr={};d.gradesView.forEach((g,i)=>gr[g.label]=i);
 const colX=ci=>PADX+ci*COLGAP;const teamY={},box={};let maxB=0;
 cols.forEach((c,ci)=>{let y=TOP;teamY[ci]={};c.nodes.forEach(nd=>{
   const ts=nd.teams; // ordered by that period's pool ladder (best at top)
   const h=Math.max(ROWH,ts.length*ROWH);box[nd.id]={id:nd.id,x:colX(ci),y,h,label:nd.label,net:nd.net};
   ts.forEach((t,k)=>teamY[ci][t]=y+k*ROWH+ROWH/2);y+=h+NODEGAP;});maxB=Math.max(maxB,y);});
 const H=maxB+6;const hi=flowHiSet(d);
 let base='',top='',hit='';
 F.paths.forEach(p=>{const col=COLHEX[p.grade]||'#8a8a8a';const on=!hi||hi.has(p.team);
  for(let ci=0;ci<nc-1;ci++){const a=p.nodes[ci],b=p.nodes[ci+1];if(!a||!b)continue;
   const y1=teamY[ci][p.team],y2=teamY[ci+1][p.team];if(y1==null||y2==null)continue;
   const x1=box[a].x+NW,x2=box[b].x,mx=(x1+x2)/2;const dd=`M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
   const seg=`<path d="${dd}" fill="none" stroke="${col}" stroke-width="${on&&hi?4:2.5}" stroke-opacity="${on?(hi?0.95:0.5):0.07}"><title>${esc(dn(p.team))} — ${esc(p.grade)}</title></path>`;
   if(on&&hi)top+=seg;else base+=seg;
   hit+=`<path d="${dd}" fill="none" stroke="#000" stroke-opacity="0" stroke-width="12" data-tm="${esc(p.team)}" style="cursor:pointer"/>`;
  }});
 let nds='';Object.values(box).forEach(b=>{const c=COLHEX[b.label];
  const fill=c?c+'33':(b.net==='HIGH'?'rgba(0,245,212,.16)':'rgba(154,154,154,.16)');const st=c||(b.net==='HIGH'?'#00f5d4':'#888');
  nds+=`<rect x="${b.x}" y="${b.y}" width="${NW}" height="${b.h}" rx="5" fill="${fill}" stroke="${st}" stroke-width="1.2" data-nd="${b.id}" style="cursor:pointer"/><text x="${b.x+NW/2}" y="${b.y+b.h/2+3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" style="pointer-events:none">${esc(b.label)}</text>`;});
 let hdr='';cols.forEach((c,ci)=>hdr+=`<text x="${colX(ci)+NW/2}" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#9a9a9a">${esc(c.period)}</text>`);
 const clubs=[...new Set(Object.keys(d.teams).map(club))].sort();
 let opts=`<option value="">Highlight…</option>`;
 clubs.forEach(c=>{opts+=`<option value="club:${esc(c)}"${state.flowHi==='club:'+c?' selected':''}>${esc(c)}</option>`;
   Object.keys(d.teams).filter(n=>club(n)===c).sort().forEach(n=>{opts+=`<option value="team:${esc(n)}"${state.flowHi==='team:'+n?' selected':''}>\u00a0\u00a0\u00a0${dn(n)}</option>`;});});
 const picker=`<select id="flowhi">${opts}</select>`;
 const hiArr=hi?[...hi].sort():[];
 const cap=hiArr.length?`<div class="flowcap">${hiArr.length>1?`<span class="tiny muted">${hiArr.length} teams</span>`:''}${hiArr.map(n=>`<span class="fc" data-team="${esc(n)}">${dn(n)}</span>`).join('')}<button class="fcx" id="fcx">clear ✕</button></div>`:'';
 main.innerHTML=`<div class="note">Where every team moved across the grading periods. Each line is a team, coloured by its ${d.ongoing?'current':'final'} grade; boxes are the pools each period (strongest pool at top; full-net above lowered), and within a box teams sit in that pool's ladder order — 1st at the top. <b>Tap a line to trace a team, or tap a box to highlight everyone in it;</b> names appear below (tap a name for its page).</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${picker}</div>${cap}<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px"><svg width="${W}" height="${H}" style="min-width:${W}px;display:block"></svg></div>`;
 const svg=main.querySelector('svg');svg.innerHTML=base+top+hit+nds+hdr;
 svg.onclick=e=>{const t=e.target.closest('[data-tm]'),n=e.target.closest('[data-nd]');
  if(t){state.flowHi='team:'+t.getAttribute('data-tm');renderFlow(d);}
  else if(n){state.flowHi=(state.flowHi==='node:'+n.getAttribute('data-nd'))?'':'node:'+n.getAttribute('data-nd');renderFlow(d);}};
 $('#flowhi').onchange=e=>{state.flowHi=e.target.value;renderFlow(d);};
 document.querySelectorAll('.fc').forEach(el=>el.onclick=()=>go({team:el.dataset.team}));
 const xb=$('#fcx');if(xb)xb.onclick=()=>{state.flowHi='';renderFlow(d);};
}

function bindTeam(){document.querySelectorAll('[data-team]').forEach(el=>el.onclick=()=>go({team:el.dataset.team}));}
function go(p){Object.assign(state,p);if(p.view||p.season)state.team=null;if(p.team)state.q='';render();window.scrollTo(0,0);}
$('#season').onchange=e=>{state.season=e.target.value;state.team=null;setSub();render();};
$('#search').oninput=e=>{state.q=e.target.value.trim();state.team=null;render();};
window.addEventListener('resize',()=>{if(state.view==='flow'&&!state.team&&!state.q)renderFlow(DATA[state.season]);});
seasonSel();setSub();render();
</script></body></html>
