<!DOCTYPE html>
<html lang="en-AU"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetSetGo Round Robin — Spring 2026 Draw</title>
<style>
:root{--bg:#121212;--surface:#1e1e1e;--elevated:#2a2a2a;--border:#2e2e2e;--accent:#00f5d4;--accent-dim:rgba(0,245,212,0.12);--text:#fff;--text2:#9a9a9a;--text3:#5a5a5a;--win:#4caf50;--loss:#f44336;--draw:#ff9800}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.35}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
.wrap{max-width:1000px;margin:0 auto;min-height:100dvh}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px 10px}
.htop{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:1.02rem}.logo .dot{color:var(--accent)}
.sub{color:var(--text2);font-size:.7rem;margin-top:2px}
.live{margin-left:auto;font-size:.66rem;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--elevated);color:var(--text2);white-space:nowrap}
.live.on{background:var(--accent-dim);color:var(--accent)}
.fbar{display:flex;gap:6px;margin-top:10px}
select{appearance:none;background:var(--elevated);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:.82rem;outline:none;cursor:pointer;min-width:0}
#ft{flex:0 0 auto}#fv{flex:1}
.clr{background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:0 11px;font-size:.78rem;color:var(--text2)}
.pools{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pchip{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.pchip.sel{border-color:currentColor}
nav{display:flex;gap:4px;margin-top:9px}
.tab{flex:1;padding:7px 4px;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--text2);background:var(--elevated)}
.tab.on{background:var(--accent-dim);color:var(--accent)}
main{padding:12px 12px 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.sh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sh .t{font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums}
.sh .r{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.bye{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text2);border:1.5px dashed var(--text3);border-radius:8px;padding:3px 9px;transition:opacity .12s}
.bye b{color:var(--text);font-weight:600}
.ch{display:grid;grid-template-columns:1fr 1fr;background:var(--elevated)}
.ch div{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:3px 10px}
.ch div+div{border-left:2px solid var(--border)}
.grid{display:grid;gap:1px;background:var(--border);grid-template-columns:repeat(4,1fr);grid-template-areas:"c1 c2 c5 c6" "c3 c4 c7 c8"}
.c1{grid-area:c1}.c2{grid-area:c2}.c3{grid-area:c3}.c4{grid-area:c4}.c5{grid-area:c5}.c6{grid-area:c6}.c7{grid-area:c7}.c8{grid-area:c8}
.c5,.c7{border-left:2px solid var(--border)}
.fx{background:var(--surface);padding:7px 9px 8px;min-height:70px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;transition:opacity .12s;border-top:3px solid var(--pc,transparent);min-width:0}
.fx:hover{background:#242424}
.fx .top{display:flex;align-items:center;gap:5px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.fx .pl{margin-left:auto;color:var(--pc);white-space:nowrap}
.sp{color:var(--text2);font-weight:600;text-transform:none;letter-spacing:0}
.tm{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;min-width:0}
.tm .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .sc{font-variant-numeric:tabular-nums;font-weight:800;color:var(--text2)}
.tm.w .sc{color:var(--accent)}.tm.l .n{color:var(--text2)}
.meta{font-size:.64rem;color:var(--text2);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .k{color:var(--text3)}
.em{background:var(--bg);min-height:70px}
.filtering .fx:not(.hi),.filtering .bye:not(.hi){opacity:.18}
.fx.hi{box-shadow:inset 0 0 0 2px var(--accent)}
.bye.hi{border-color:var(--accent);color:var(--accent)}
.bdg{flex-shrink:0;object-fit:cover;vertical-align:middle}
.bdgf{display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.chip{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.03em;vertical-align:middle;white-space:nowrap}
.note{font-size:.72rem;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.path .row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border);font-size:.8rem;cursor:pointer}
.path .row:hover{background:var(--elevated)}
.path .tt{font-variant-numeric:tabular-nums;font-weight:700;width:42px}
.path .cc{color:var(--text3);font-size:.68rem;width:38px}
.path .op{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;flex-shrink:0}
.rb.W{background:rgba(76,175,80,.18);color:var(--win)}.rb.L{background:rgba(244,67,54,.18);color:var(--loss)}.rb.D{background:rgba(255,152,0,.18);color:var(--draw)}.rb.N{background:var(--elevated);color:var(--text3)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th:not(.al),td:not(.al){white-space:nowrap}
th.al,td.al{width:100%;text-align:left}
th{font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;color:var(--text3);font-weight:600;text-align:right;padding:7px 6px}
td{padding:8px 6px;border-top:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
td.al .tn{display:flex;align-items:center;gap:7px;font-weight:600}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--elevated)}
.rk{color:var(--text3)}
.gd.pos{color:var(--win)}.gd.neg{color:var(--loss)}
.sd{color:var(--text2);font-size:.72rem}
.ph{padding:9px 12px;font-size:.8rem;font-weight:800;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.ph .x{margin-left:auto;font-size:.64rem;color:var(--text2);font-weight:600}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;z-index:41;display:none;padding:14px 14px 24px}
.sheet.show{display:block}
.sx{position:absolute;right:10px;top:8px;font-size:1.3rem;color:var(--text2);padding:4px 8px}
.st{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:10px;padding-right:30px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;margin-bottom:12px}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px}
.side .nm{font-weight:700;font-size:.9rem;line-height:1.2}
.side .ln{font-size:.7rem;color:var(--text2)}
.mid{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;padding-top:14px;white-space:nowrap}
.mid .v{font-size:.8rem;color:var(--text3);font-weight:700}
.sec{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin:14px 0 6px}
.mtg{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:.8rem}
.mtg .d{color:var(--text3);font-size:.68rem;width:62px}
.mtg .p{flex:1;color:var(--text2);font-size:.72rem}
.mtg .s{font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:560px){.wide{display:none}}
.sub2{display:block;font-size:.66rem;color:var(--text2);font-weight:500;margin-top:2px}
.gp{flex-shrink:0;font-size:.58rem;font-weight:800;padding:1px 5px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.lrow td:first-child{box-shadow:inset 4px 0 0 var(--pc)}
.filtering tr.lrow:not(.hi){opacity:.25}
tr.lrow.hi td{background:rgba(0,245,212,.06)}
.path .row.idle{padding:2px 12px;font-size:.66rem;color:var(--text3);cursor:default;background:var(--bg)}
.path .row.idle:hover{background:var(--bg)}
.path .row.idle .tt{font-weight:600}
footer{color:var(--text3);font-size:.68rem;padding:4px 14px 30px;line-height:1.5}
@media (max-width:560px){
 .grid{grid-template-columns:1fr 1fr;grid-template-areas:"c1 c2" "c3 c4" "c5 c6" "c7 c8"}
 .c5,.c7{border-left:none}
 .c5,.c6{border-top:2px solid var(--border)}
 .ch{display:none}
 .fx,.em{min-height:68px}
 .fx .gp{font-size:0;padding:0;width:10px;height:10px;border-radius:50%;background:var(--gc)!important}
}

.seg{display:flex;gap:4px;margin:4px 0 8px;background:var(--elevated);padding:4px;border-radius:10px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:.78rem;font-weight:600;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.seg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on{background:var(--accent-dim);color:var(--accent)}
.phl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:8px 0 2px}
.mx{overflow-x:auto;border-top:1px solid var(--border)}
.mx table{font-size:.7rem}
.mx th{padding:6px 3px;text-align:center}
.mx td{padding:5px 3px;text-align:center;vertical-align:middle;line-height:1.25}
.mx td.rh{text-align:left;padding-left:10px}
.mx td.self{background:var(--elevated)}
.mx .W{color:var(--win)}.mx .L{color:var(--loss)}.mx .D{color:var(--draw)}
.mx .nm{color:var(--text3)}
.cap{font-size:.62rem;color:var(--text3);padding:6px 12px 9px}
.lnk{color:var(--accent);font-size:.72rem;font-weight:600;cursor:pointer}

const POOLCOL={Pink:'#f48fb1',Yellow:'#ffc107',Red:'#f44336',White:'#e0e0e0',Orange:'#ff9800',Green:'#4caf50',Blue:'#2196f3'};
const POOLS=['Blue','Green','Orange','Pink','Red','White','Yellow'];
const GORD=['BLUE','GREEN','ORANGE','RED','WHITE','YELLOW'];
const GRADECOL={BLUE:'#2196f3',RED:'#f44336',YELLOW:'#ffc107',WHITE:'#e0e0e0',GREEN:'#4caf50',ORANGE:'#ff9800'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=n=>n.replace(/Ringwood North/,'Ringwood Nth').replace(/Heathmont United/,'Heathmont Utd').replace(/Our Ladys/,"Our Lady's");
const CLUBKEYS=Object.keys(P.clubs).sort((a,b)=>b.length-a.length);
const club=n=>CLUBKEYS.find(k=>n.toLowerCase().startsWith(k.toLowerCase()))||n;
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const fmtD=s=>new Date(s+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const rec=(w,l,d)=>`${w}–${l}${d?'–'+d:''}`;
function bdg(n,sz){sz=sz||18;const c=P.clubs[club(n)];const r=Math.round(sz*.28);
 if(c&&c.badge)return `<img class="bdg" src="${c.badge}" width="${sz}" height="${sz}" style="border-radius:${r}px;box-shadow:0 0 0 1.5px ${c.colour}" alt="">`;
 return `<span class="bdg bdgf" style="width:${sz}px;height:${sz}px;border-radius:${r}px;font-size:${Math.round(sz*.42)}px;background:#8882">${esc(n[0])}</span>`;}
const gchip=g=>`<span class="chip" style="background:${GRADECOL[g]}22;color:${GRADECOL[g]}">${esc(g)}</span>`;
const pchip=(p,extra)=>`<span class="chip" style="background:${POOLCOL[p]}22;color:${POOLCOL[p]}">${esc(p)}${extra||''}</span>`;
const FIX=[];P.slots.forEach(s=>s.g.forEach(g=>{g.t=s.t;FIX.push(g);}));
const BYID=Object.fromEntries(FIX.map(g=>[g.id,g]));
const TEAMS=Object.keys(P.teams).sort();
const CLUBS=[...new Set(TEAMS.map(club))].sort();
let state={view:'draw',ft:'team',fv:''};
try{const s=JSON.parse(localStorage.getItem('rrSpring26draw')||'{}');if(s.ft)state.ft=s.ft;if(typeof s.fv==='string')state.fv=s.fv;if(s.view)state.view=s.view;}catch(e){}
const save=()=>{try{localStorage.setItem('rrSpring26draw',JSON.stringify(state));}catch(e){}};

function h2h(m){let w=0,l=0,d=0;m.forEach(x=>x[1]>x[2]?w++:x[1]<x[2]?l++:d++);return [w,l,d];}
function h2hLine(g){const m=g.m;if(!m.length)return '<span class="k">No meeting this season</span>';
 const [w,l,d]=h2h(m),last=m[m.length-1];
 return `<span class="k">Season H2H</span> ${rec(w,l,d)} · last ${last[1]}–${last[2]}${last[4]?'½':''}`;}
function matches(g){if(!state.fv)return false;
 if(state.ft==='team')return g.h===state.fv||g.a===state.fv;
 if(state.ft==='club')return club(g.h)===state.fv||club(g.a)===state.fv;
 return g.p===state.fv;}
function byeMatch(b){if(!state.fv||!b)return false;
 if(state.ft==='team')return b===state.fv; if(state.ft==='club')return club(b)===state.fv; return P.teams[b].pool===state.fv;}
const gp=n=>{const t=P.teams[n];if(!t)return '';const c=GRADECOL[t.grade];return `<span class="gp" title="${esc(t.grade)} grade" style="--gc:${c};background:${c}22;color:${c}">${esc(t.grade)}</span>`;};
const gradeLine=n=>`${gchip(P.teams[n].grade)} grade`;

function cell(g){
 const sp=g.c>=2&&g.c<=4?' <span class="sp">· small<span class="wide"> poles</span></span>':'';
 const row=n=>`<div class="tm">${bdg(n)}<span class="n">${esc(short(n))}</span>${gp(n)}</div>`;
 return `<div class="fx c${g.c} ${matches(g)?'hi':''}" style="--pc:${POOLCOL[g.p]}" data-id="${g.id}">
  <div class="top">Court ${g.c}${sp}<span class="pl">${esc(g.p)} · R${g.r}</span></div>
  ${row(g.h)}${row(g.a)}</div>`;}

function pathCard(){
 if(state.ft!=='team'||!state.fv)return '';
 const n=state.fv,t=P.teams[n];
 const gameRow=g=>{const home=g.h===n,opp=home?g.a:g.h;const m=g.m.map(x=>home?x:[x[0],x[2],x[1],x[3],x[4]]);
  const [w,l,d]=h2h(m);
  return `<div class="row" data-id="${g.id}"><span class="tt">${esc(g.t)}</span><span class="cc">Ct ${g.c}</span>${bdg(opp)}<span class="op">${esc(short(opp))}</span>${gp(opp)}</div>`;};
 
 const rows=P.slots.map(s=>{const g=s.g.find(x=>x.h===n||x.a===n);
  if(g)return gameRow(g);
  if(s.b===n)return `<div class="row idle"><span class="tt">${esc(s.t)}</span><span class="op">Bye</span></div>`;
  return `<div class="row idle"><span class="tt">${esc(s.t)}</span><span class="op">—</span></div>`;}).join('');
 return `<div class="card path"><div class="ph">${bdg(n,22)}${esc(short(n))} ${pchip(t.pool)}<span class="x">${gradeLine(n)}</span></div>${rows}</div>`;}
function renderDraw(){
 let h=pathCard()+`<div class="${state.fv?'filtering':''}">`;
 P.slots.forEach(s=>{
  const rounds=[...new Set(s.g.map(g=>g.r))].sort(),byC={};s.g.forEach(g=>byC[g.c]=g);
  h+=`<div class="card"><div class="sh"><span class="t">${esc(s.t)} pm</span><span class="r">Round ${rounds.join(' / ')}</span>${s.b?`<span class="bye ${byeMatch(s.b)?'hi':''}">Bye ${bdg(s.b,16)}<b>${esc(short(s.b))}</b></span>`:''}</div>
   <div class="ch"><div>Indoor · Courts 1–4</div><div>Outdoor · Courts 5–8</div></div><div class="grid">`;
  for(let c=1;c<=8;c++)h+=byC[c]?cell(byC[c]):`<div class="em c${c}"></div>`;
  h+='</div></div>';});
 $('#main').innerHTML=h+'</div>';}

function poolCard(pool){
 const ts=TEAMS.filter(n=>P.teams[n].pool===pool).sort((x,y)=>GORD.indexOf(P.teams[x].grade)-GORD.indexOf(P.teams[y].grade)||x.localeCompare(y));
 return `<div class="card"><div class="ph" style="color:${POOLCOL[pool]}">${esc(pool)} pool<span class="x">${ts.length} teams · ${FIX.filter(g=>g.p===pool).length} games</span></div>
 <table><tbody>${ts.map(n=>`<tr class="clk" data-team="${esc(n)}"><td class="al"><span class="tn">${bdg(n,22)}${esc(short(n))}</span></td><td>${gchip(P.teams[n].grade)}</td></tr>`).join('')}</tbody></table></div>`;}
function renderPools(){
 const list=state.ft==='pool'&&state.fv?[state.fv]:state.fv?[...new Set(FIX.filter(matches).map(g=>g.p))]:POOLS;
 $('#main').innerHTML=list.map(poolCard).join('');}

function teamMatch(n){if(!state.fv)return false;
 if(state.ft==='team')return n===state.fv; if(state.ft==='club')return club(n)===state.fv; return P.teams[n].pool===state.fv;}
function renderLadders(){
 let h=`<div class="note">Current grade ladders for the 2026 Spring season, results to ${esc(fmtD(P.asof))}. The coloured bar and tag on each team show its round robin pool. Use the pool buttons or filter above to pick teams out.</div><div class="${state.fv?'filtering':''}">`;
 GORD.forEach(gr=>{
  const ts=TEAMS.filter(n=>P.teams[n].grade===gr).sort((a,b)=>P.teams[a].gpos-P.teams[b].gpos);if(!ts.length)return;
  const net=P.teams[ts[0]].net;
  h+=`<div class="card"><div class="ph">${gchip(gr)} grade<span class="x">${net==='HIGH'?'full nets':'low nets'} · ${ts.length} teams</span></div>
  <table><thead><tr><th>#</th><th class="al">Team</th><th>P</th><th>W</th><th>L</th><th>D</th><th>GD</th></tr></thead><tbody>${ts.map(n=>{const t=P.teams[n],g=t.g,gd=g[4]-g[5];
   return `<tr class="clk lrow ${teamMatch(n)?'hi':''}" data-team="${esc(n)}" style="--pc:${POOLCOL[t.pool]}"><td class="rk">${t.gpos}</td><td class="al"><span class="tn">${bdg(n,22)}<span>${esc(short(n))}<span class="sub2">${pchip(t.pool,' pool')}</span></span></span></td><td>${g[0]}</td><td>${g[1]}</td><td>${g[2]}</td><td>${g[3]}</td><td class="gd ${gd>0?'pos':gd<0?'neg':''}">${gd>0?'+':''}${gd}</td></tr>`;}).join('')}</tbody></table></div>`;});
 $('#main').innerHTML=h+'</div>';}
function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
 renderFilters();state.view==='pools'?renderPools():renderDraw();
 
 $('#foot').innerHTML=`Draw from the NetSetGo 9 &amp; Under Mixed Round Robin fixture. The coloured tag after each team is the grade it currently plays in (on phones, a coloured dot: tap a game to see the grade names). Courts 1–4 indoor, 5–8 outdoor.`;}
function renderFilters(){
 $('#ft').value=state.ft;
 const opts=state.ft==='team'?TEAMS.map(t=>[t,short(t)]):state.ft==='club'?CLUBS.map(c=>[c,short(c)]):POOLS.map(p=>[p,p+' pool']);
 $('#fv').innerHTML=`<option value="">— choose ${state.ft} —</option>`+opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');
 $('#fv').value=state.fv;
 $('#pools').innerHTML=POOLS.map(p=>`<button class="pchip ${state.ft==='pool'&&state.fv===p?'sel':''}" data-p="${p}" style="background:${POOLCOL[p]}22;color:${POOLCOL[p]}">${p}</button>`).join('');}

function seasonList(n){
 const t=P.teams[n];let h='',ph='';
 t.gm.forEach(g=>{if(g[6]!==ph){ph=g[6];h+=`<div class="phl">${esc(ph==='Current'?'Current grade':ph)}</div>`;}
  h+=`<div class="mtg"><span class="d">${fmtD(g[0])}</span>${bdg(g[1],18)}<span class="p" style="color:var(--text)">${esc(short(g[1]))} ${gp(g[1])}${g[5]?' <span class="sd">· shortened</span>':''}</span><span class="s">${g[2]}–${g[3]}</span><span class="rb ${g[4]}">${g[4]}</span></div>`;});
 return h||'<div class="mtg"><span class="p">No scored games.</span></div>';}
const sideInfo=n=>`<div class="ln">${gradeLine(n)}</div>`;
const sideInfoOld=n=>{const t=P.teams[n];return `<div class="ln">${gradeLine(n)}</div><div class="ln">Grade ${rec(t.g[1],t.g[2],t.g[3])} · Season ${rec(t.s[0],t.s[1],t.s[2])}</div><div class="ln">Goals ${t.s[3]}–${t.s[4]}</div>`;};
function openSheet(html){$('#sbody').innerHTML=html;$('#scrim').classList.add('show');$('#sheet').classList.add('show');$('#sheet').scrollTop=0;}
function closeSheet(){$('#scrim').classList.remove('show');$('#sheet').classList.remove('show');}
function openGame(id){
 const g=BYID[id];if(!g)return;
 let h=`<div class="st">${esc(g.t)} pm · Court ${g.c}${g.c>=2&&g.c<=4?' (small poles)':''} · ${pchip(g.p,' pool')} Round ${g.r}</div>
  <div class="vs"><div class="side">${bdg(g.h,44)}<div class="nm">${esc(short(g.h))}</div>${sideInfo(g.h)}</div><div class="mid"><span class="v">v</span></div><div class="side">${bdg(g.a,44)}<div class="nm">${esc(short(g.a))}</div>${sideInfo(g.a)}</div></div>`;
 const rr=n=>FIX.filter(x=>x.h===n||x.a===n).map(x=>{const o=x.h===n?x.a:x.h;return `<div class="mtg"><span class="d">${esc(x.t)} pm</span>${bdg(o,18)}<span class="p" style="color:var(--text)">${esc(short(o))} ${gp(o)}</span><span class="sd">Ct ${x.c}</span></div>`;}).join('');
 h+=`<div class="sec">${esc(short(g.h))} — round robin games</div>${rr(g.h)}<div class="sec">${esc(short(g.a))} — round robin games</div>${rr(g.a)}`;
 openSheet(h);}
function openTeam(n){
 const t=P.teams[n];if(!t)return;
 const rows=FIX.filter(x=>x.h===n||x.a===n).map(x=>{const o=x.h===n?x.a:x.h;return `<div class="mtg"><span class="d">${esc(x.t)} pm</span>${bdg(o,18)}<span class="p" style="color:var(--text)">${esc(short(o))} ${gp(o)}</span><span class="sd">Ct ${x.c}</span></div>`;}).join('');
 const bye=P.slots.find(s=>s.b===n);
 openSheet(`<div class="st">${pchip(t.pool,' pool')}</div><div class="vs" style="grid-template-columns:1fr"><div class="side">${bdg(n,48)}<div class="nm">${esc(short(n))}</div>${sideInfo(n)}</div></div>
  <div class="sec">Round robin games</div>${rows}${bye?`<div class="mtg"><span class="d">${esc(bye.t)} pm</span><span class="p">Bye</span></div>`:''}`);}
$('#ft').onchange=e=>{state.ft=e.target.value;state.fv='';save();render();};
$('#fv').onchange=e=>{state.fv=e.target.value;save();render();};
$('#clr').onclick=()=>{state.fv='';save();render();};
$('#pools').onclick=e=>{const b=e.target.closest('.pchip');if(!b)return;const p=b.dataset.p;if(state.ft==='pool'&&state.fv===p){state.fv='';}else{state.ft='pool';state.fv=p;}save();render();};
document.querySelector('nav').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;state.view=b.dataset.v;save();render();window.scrollTo(0,0);};
$('#main').onclick=e=>{const l=e.target.closest('[data-team]');if(l){openTeam(l.dataset.team);return;}
 const f=e.target.closest('[data-id]');if(f)openGame(f.dataset.id);};
$('#sbody').onclick=e=>{const b=e.target.closest('.seg button');if(!b)return;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));$('#slist').innerHTML=seasonList(b.dataset.s);};
$('#scrim').onclick=closeSheet;$('#sx').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
render();
</script>
</body></html>
