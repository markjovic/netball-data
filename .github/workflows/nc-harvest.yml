name: nc-harvest

# Harvest 9U competition results (incl per-quarter) by expanding each division's id block
# from round/matches seeds, plus an optional coarse scan for finished/hidden comps.
# Set comp_names (comma list) to collect several competitions from one scan pass.
# Output: harvest-out/matches-<compId>.json per comp (+ run summary). Read-only; commits nothing.

on:
  workflow_dispatch:
    inputs:
      comp_id:
        description: 'Primary numeric competition id (seeds round/matches)'
        required: true
        default: '5232'
      comp_key:
        description: 'competitionUniqueKey (uuid) used as the gameSummary key'
        required: true
        default: '8819433a-2375-4c6a-9039-4658036b083d'
      comp_name:
        description: 'Primary exact competitionName to match'
        required: true
        default: 'MENA - Club Competition SPRING FRI 9 & U NETSETGO'
      comp_names:
        description: 'Optional comma-separated list of competitionNames to collect in one scan (blank = just comp_name)'
        required: false
        default: ''
      scan_lo:
        description: 'Optional coarse-scan low id (finished/hidden comps with no round/matches seeds)'
        required: false
        default: '0'
      scan_hi:
        description: 'Optional coarse-scan high id'
        required: false
        default: '0'
      coarse_step:
        description: 'Coarse scan step (lower = denser/slower)'
        required: false
        default: '8'
      conc:
        description: 'Concurrent requests per batch (lower = politer)'
        required: false
        default: '8'
      batch_delay:
        description: 'Milliseconds to pause between batches (higher = politer)'
        required: false
        default: '120'
      survey:
        description: 'SURVEY mode: just locate every comp in scan_lo..scan_hi (no harvest)'
        type: boolean
        default: false
      probe_ids:
        description: 'PROBE mode: comma-separated match ids to diagnose (blank = normal run)'
        required: false
        default: ''
      keys:
        description: 'PROBE mode: comma-separated competitionUniqueKeys to test each id against'
        required: false
        default: ''
      raw_urls:
        description: 'RAW mode: ;;-separated endpoint URLs (relative to the squadi api host) to dump raw'
        required: false
        default: ''
      user_lo:
        description: 'USER_SCAN linear low userId (blank/0 = off; use center+radius instead for outward scan)'
        required: false
        default: '0'
      user_hi:
        description: 'USER_SCAN linear high userId'
        required: false
        default: '0'
      user_center:
        description: 'USER_SCAN outward-scan centre userId (covers densest region first)'
        required: false
        default: '0'
      user_radius:
        description: 'USER_SCAN outward-scan radius (+/- around centre)'
        required: false
        default: '0'
      sport_ref:
        description: 'USER_SCAN sportRefId (1 = netball)'
        required: false
        default: '1'
      user_ids:
        description: 'USER_IDS mode (exact userId list, full career, no names): run:<runId> of the USER_SCAN run (uses its users-scan.json), a repo .json path, or comma ids. Blank = off'
        required: false
        default: ''
      full_history:
        description: 'USER_SCAN: store FULL netball history (all comps, no names) -> users-history.json. comp_filter blank = keep EVERY netball player in range; set = keep players in those comps'
        type: boolean
        default: false
      comp_filter:
        description: 'USER_SCAN: optional comma competition ids to keep (e.g. 4057,4596,5232)'
        required: false
        default: ''
      run_budget_min:
        description: 'USER_SCAN wall-clock stop in minutes (0 = off). Script writes final output then exits.'
        required: false
        default: '0'
      backoff_min:
        description: 'USER_SCAN WAF pause (minutes); lengthens each break, capped 30'
        required: false
        default: '10'
      max_calls:
        description: 'Safety cap on API calls'
        required: false
        default: '60000'

permissions:
  contents: read
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show preinstalled Node
        run: |
          set -euo pipefail
          node --version

      - name: Install Playwright and Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Fetch userId list from an earlier run (user_ids = run:<id> or a bare run id)
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ inputs.user_ids }}
        run: |
          set -euo pipefail
          S="$(printf '%s' "$SRC" | tr -d '[:space:]')"
          RID=""
          case "$S" in [Rr][Uu][Nn]:*) RID="${S#*:}";; esac
          if [ -z "$RID" ] && printf '%s' "$S" | grep -Eq '^[0-9]{10,}$'; then RID="$S"; fi
          if [ -z "$S" ]; then echo "user_ids blank - nothing to fetch"; exit 0; fi
          if [ -z "$RID" ] && ! printf '%s' "$S" | grep -qi '^run:'; then echo "user_ids is not a run reference - no download"; exit 0; fi
          case "$RID" in ''|*[!0-9]*) echo "::error::user_ids run id is not numeric: $SRC"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/ids-in"
          gh run download "$RID" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/ids-in"
          F="$(find "$RUNNER_TEMP/ids-in" -name users-scan.json | head -n1)"
          if [ -z "$F" ]; then echo "::error::no users-scan.json in the artifacts of run $RID"; exit 1; fi
          echo "USER_IDS_FILE=$F" >> "$GITHUB_ENV"
          echo "using $F from run $RID ($(wc -c < "$F") bytes)"

      - name: Harvest
        env:
          COMP_ID: ${{ inputs.comp_id }}
          COMP_KEY: ${{ inputs.comp_key }}
          COMP_NAME: ${{ inputs.comp_name }}
          COMP_NAMES: ${{ inputs.comp_names }}
          SCAN_LO: ${{ inputs.scan_lo }}
          SCAN_HI: ${{ inputs.scan_hi }}
          COARSE_STEP: ${{ inputs.coarse_step }}
          CONC: ${{ inputs.conc }}
          BATCH_DELAY: ${{ inputs.batch_delay }}
          SURVEY: ${{ inputs.survey }}
          PROBE_IDS: ${{ inputs.probe_ids }}
          KEYS: ${{ inputs.keys }}
          RAW_URLS: ${{ inputs.raw_urls }}
          USER_LO: ${{ inputs.user_lo }}
          USER_HI: ${{ inputs.user_hi }}
          USER_CENTER: ${{ inputs.user_center }}
          USER_RADIUS: ${{ inputs.user_radius }}
          SPORT_REF: ${{ inputs.sport_ref }}
          USER_IDS: ${{ inputs.user_ids }}
          COMP_FILTER: ${{ inputs.comp_filter }}
          FULL_HISTORY: ${{ inputs.full_history }}
          RUN_BUDGET_MIN: ${{ inputs.run_budget_min }}
          BACKOFF_MIN: ${{ inputs.backoff_min }}
          MAX_CALLS: ${{ inputs.max_calls }}
          OUT_DIR: ${{ github.workspace }}/harvest-out
        run: |
          set -euo pipefail
          cp scripts/nc-harvest.mjs "$RUNNER_TEMP/pw/"
          node "$RUNNER_TEMP/pw/nc-harvest.mjs"

      - name: Upload harvest
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-harvest-${{ inputs.comp_id }}-${{ github.run_id }}
          path: harvest-out/
          if-no-files-found: error
          retention-days: 30

      - name: Put artifact download link in the summary
        if: always()
        run: |
          {
            echo ""
            echo "## Download the harvest"
            echo "[nc-harvest-${{ inputs.comp_id }}-${{ github.run_id }}.zip](${{ steps.upload.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
