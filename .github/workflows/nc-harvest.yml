name: nc-harvest

# Harvest 9U competition results (incl per-quarter) by expanding each division's id block
# from round/matches seeds, plus an optional coarse scan for finished/hidden comps.
# Set comp_names (comma list) to collect several competitions from one scan pass.
# Output: harvest-out/matches-<compId>.json per comp (+ run summary). Read-only; commits nothing.

on:
  workflow_dispatch:
    inputs:
      comp_id:
        description: 'Primary numeric competition id (seeds round/matches)'
        required: true
        default: '5232'
      comp_key:
        description: 'competitionUniqueKey (uuid) used as the gameSummary key'
        required: true
        default: '8819433a-2375-4c6a-9039-4658036b083d'
      comp_name:
        description: 'Primary exact competitionName to match'
        required: true
        default: 'MENA - Club Competition SPRING FRI 9 & U NETSETGO'
      comp_names:
        description: 'Optional comma-separated list of competitionNames to collect in one scan (blank = just comp_name)'
        required: false
        default: ''
      scan_lo:
        description: 'Optional coarse-scan low id (finished/hidden comps with no round/matches seeds)'
        required: false
        default: '0'
      scan_hi:
        description: 'Optional coarse-scan high id'
        required: false
        default: '0'
      coarse_step:
        description: 'Coarse scan step (lower = denser/slower)'
        required: false
        default: '8'
      conc:
        description: 'Concurrent requests per batch (lower = politer)'
        required: false
        default: '8'
      batch_delay:
        description: 'Milliseconds to pause between batches (higher = politer)'
        required: false
        default: '120'
      survey:
        description: 'SURVEY mode: just locate every comp in scan_lo..scan_hi (no harvest)'
        type: boolean
        default: false
      probe_ids:
        description: 'PROBE mode: comma-separated match ids to diagnose (blank = normal run)'
        required: false
        default: ''
      keys:
        description: 'PROBE mode: comma-separated competitionUniqueKeys to test each id against'
        required: false
        default: ''
      raw_urls:
        description: 'RAW mode: ;;-separated endpoint URLs (relative to the squadi api host) to dump raw'
        required: false
        default: ''
      max_calls:
        description: 'Safety cap on API calls'
        required: false
        default: '60000'

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show preinstalled Node
        run: |
          set -euo pipefail
          node --version

      - name: Install Playwright and Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Harvest
        env:
          COMP_ID: ${{ inputs.comp_id }}
          COMP_KEY: ${{ inputs.comp_key }}
          COMP_NAME: ${{ inputs.comp_name }}
          COMP_NAMES: ${{ inputs.comp_names }}
          SCAN_LO: ${{ inputs.scan_lo }}
          SCAN_HI: ${{ inputs.scan_hi }}
          COARSE_STEP: ${{ inputs.coarse_step }}
          CONC: ${{ inputs.conc }}
          BATCH_DELAY: ${{ inputs.batch_delay }}
          SURVEY: ${{ inputs.survey }}
          PROBE_IDS: ${{ inputs.probe_ids }}
          KEYS: ${{ inputs.keys }}
          RAW_URLS: ${{ inputs.raw_urls }}
          MAX_CALLS: ${{ inputs.max_calls }}
          OUT_DIR: ${{ github.workspace }}/harvest-out
        run: |
          set -euo pipefail
          cp scripts/nc-harvest.mjs "$RUNNER_TEMP/pw/"
          node "$RUNNER_TEMP/pw/nc-harvest.mjs"

      - name: Upload harvest
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-harvest-${{ inputs.comp_id }}-${{ github.run_id }}
          path: harvest-out/
          if-no-files-found: error
          retention-days: 30

      - name: Put artifact download link in the summary
        if: always()
        run: |
          {
            echo ""
            echo "## Download the harvest"
            echo "[nc-harvest-${{ inputs.comp_id }}-${{ github.run_id }}.zip](${{ steps.upload.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
