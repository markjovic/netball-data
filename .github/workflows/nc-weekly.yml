name: nc-weekly

# Weekly update of the MENA 9U site, with no manual steps:
#   0. read MENA's competition list for this year and next; add any new Friday 9&U season / Saturday 11U comp to data/config.json
#   1. harvest every configured season still in progress (data/config.json) and merge the new results
#      into data/matches-<id>.json (a hidden 0-0 never overwrites a captured score)
#   2. refresh every known player's history (data/players.json) and scan new player ids since the last run
#   3. rebuild data/netball-data.json, index.html, data/movement.json, movement.html
#   4. commit the changes to the repo
# Runs Friday 20:00 and 22:00 Melbourne summer time (19:00 / 21:00 in winter). Scores are hidden after
# game day, so the second run is a safety net; a run with nothing new commits nothing.
# If the results harvest or the build fails, nothing is committed and the run is red.
# If only the player refresh/scan fails, results are still published, players are left as they were,
# and the run is marked red at the end so it is noticed.

on:
  schedule:
    - cron: '0 9 * * 5'
    - cron: '0 11 * * 5'
  workflow_dispatch:
    inputs:
      full_rescan:
        description: 'Rescan the whole player-id range for new players (about 100 minutes) instead of the usual lookback'
        type: boolean
        default: false
      skip_players:
        description: 'Results only: skip the player refresh and new-id scan'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nc-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright, Chromium and numpy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          # system-wide, so the isolated (-I) python used by the build sees it; -I ignores the user site-packages
          sudo python3 -m pip install --quiet numpy 2>/dev/null || sudo python3 -m pip install --quiet --break-system-packages numpy
          python3 -I -c "import numpy; print('numpy', numpy.__version__)"
          cp "$GITHUB_WORKSPACE/scripts/nc-harvest.mjs" "$RUNNER_TEMP/pw/"

      - name: Find competitions (new seasons)
        id: find
        continue-on-error: true
        run: |
          set -euo pipefail
          Y="$(TZ=Australia/Melbourne date +%Y)"
          ORG="$(python3 -I -c "import json; print(json.load(open('data/config.json', encoding='utf-8-sig'))['organisationKey'])")"
          # yearRefId = year - 2018 (2026 = 8, 2027 = 9); plan.py checks this against the year list
          RAW_URLS="/common/common/reference/year;;/livescores/competitions/list?organisationUniqueKey=$ORG&yearRefId=$((Y-2018));;/livescores/competitions/list?organisationUniqueKey=$ORG&yearRefId=$((Y-2017))" \
            RAW_MAX=5000000 OUT_DIR="$RUNNER_TEMP/find" node "$RUNNER_TEMP/pw/nc-harvest.mjs"
          test -s "$RUNNER_TEMP/find/raw.json"

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          TODAY="$(TZ=Australia/Melbourne date +%F)"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "### Plan ($TODAY)" >> "$GITHUB_STEP_SUMMARY"
          python3 -I build/plan.py "$TODAY" "${{ inputs.full_rescan || false }}" "$RUNNER_TEMP/comps.tsv" "$RUNNER_TEMP/find/raw.json"
          echo "- seasons to harvest: $(cut -f1 "$RUNNER_TEMP/comps.tsv" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Harvest results
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/harvest-dirs.txt"
          while IFS=$'\t' read -r CID KEY NAME; do
            [ -z "$CID" ] && continue
            OUT="$RUNNER_TEMP/h-$CID"
            echo "harvesting $CID ($NAME)"
            # known ids of games in the last 21 days and later, so this week's games are found even if round/matches is empty
            SEED="$(python3 -I -c "import json, os, sys, datetime; p = 'data/matches-' + sys.argv[1] + '.json'; t = (datetime.date.fromisoformat(sys.argv[2]) - datetime.timedelta(days=21)).isoformat(); print(','.join(str(m['id']) for m in json.load(open(p, encoding='utf-8-sig'))['matches'] if (m.get('startTime') or '')[:10] >= t) if os.path.exists(p) else '')" "$CID" "${{ steps.plan.outputs.today }}")"
            COMP_ID="$CID" COMP_KEY="$KEY" COMP_NAME="$NAME" SEED_IDS="$SEED" OUT_DIR="$OUT" \
              node "$RUNNER_TEMP/pw/nc-harvest.mjs"
            if ls "$OUT"/matches-*.json > /dev/null 2>&1; then
              echo "$OUT" >> "$RUNNER_TEMP/harvest-dirs.txt"
            elif [ ! -f "data/matches-$CID.json" ]; then
              echo "- $CID ($NAME): no fixtures published yet" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$CID ($NAME): harvest returned no matches"; exit 1
            fi
          done < "$RUNNER_TEMP/comps.tsv"

      - name: Refresh known players
        id: refresh
        if: ${{ !inputs.skip_players }}
        continue-on-error: true
        run: |
          set -euo pipefail
          USER_IDS="data/players.json" BATCH_DELAY=120 MAX_CALLS=100000 OUT_DIR="$RUNNER_TEMP/careers" \
            node "$RUNNER_TEMP/pw/nc-harvest.mjs"

      - name: Scan new player ids
        id: scan
        if: ${{ !inputs.skip_players }}
        continue-on-error: true
        env:
          FWD_LO: ${{ steps.plan.outputs.fwd_lo }}
          BACK_LO: ${{ steps.plan.outputs.back_lo }}
          BACK_HI: ${{ steps.plan.outputs.back_hi }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/scan-files.txt"
          BLOCK="$(python3 -I -c "import json; print(json.load(open('data/config.json', encoding='utf-8-sig'))['scan']['block'])")"
          MAXB="$(python3 -I -c "import json; print(json.load(open('data/config.json', encoding='utf-8-sig'))['scan']['maxBlocks'])")"
          scan_ids() {
            OUT="$RUNNER_TEMP/scan/$1-$2"
            USER_LO="$1" USER_HI="$2" FULL_HISTORY=true BACKOFF_MIN=10 RUN_BUDGET_MIN="$3" MAX_CALLS=1200000 OUT_DIR="$OUT" \
              node "$RUNNER_TEMP/pw/nc-harvest.mjs"
            test -f "$OUT/users-history.json"
            echo "$OUT/users-history.json" >> "$RUNNER_TEMP/scan-files.txt"
          }
          # forward: 5k blocks from the high-water mark until a block has no netball players (ids ~25% netball)
          LO="$FWD_LO"; B=0
          while :; do
            B=$((B+1)); HI=$((LO+BLOCK-1))
            scan_ids "$LO" "$HI" 20
            N="$(python3 -I -c "import json, sys; print(len(json.load(open(sys.argv[1]))['players']))" "$RUNNER_TEMP/scan/$LO-$HI/users-history.json")"
            echo "- forward ids $LO..$HI: $N netball players" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$N" -eq 0 ]; then break; fi
            if [ "$B" -ge "$MAXB" ]; then echo "::error::forward scan still finding players after $MAXB blocks - raise scan.maxBlocks"; exit 1; fi
            LO=$((HI+1))
          done
          # lookback: older ids that have just started playing (plan.py decides when)
          if [ -n "$BACK_LO" ]; then
            scan_ids "$BACK_LO" "$BACK_HI" 140
            echo "lookback=done" >> "$GITHUB_OUTPUT"
            echo "- lookback ids $BACK_LO..$BACK_HI: complete" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: |
          set -euo pipefail
          ARGS=(--today "${{ steps.plan.outputs.today }}")
          mapfile -t DIRS < "$RUNNER_TEMP/harvest-dirs.txt"
          if [ "${#DIRS[@]}" -gt 0 ]; then ARGS+=(--harvest "${DIRS[@]}"); fi
          if [ -f "$RUNNER_TEMP/careers/users-careers.json" ]; then ARGS+=(--careers "$RUNNER_TEMP/careers/users-careers.json"); fi
          mapfile -t SCANS < <(cat "$RUNNER_TEMP/scan-files.txt" 2>/dev/null || true)
          if [ "${#SCANS[@]}" -gt 0 ]; then ARGS+=(--scan "${SCANS[@]}"); fi
          if [ "${{ steps.scan.outputs.lookback }}" = "done" ]; then ARGS+=(--lookback-done); fi
          python3 -I build/build_all.py "${ARGS[@]}"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "nc-weekly"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html movement.html data/
          if git diff --cached --quiet; then
            echo "No changes to commit." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Weekly update ${{ steps.plan.outputs.today }}"
            git push
            echo "Committed: $(git diff --stat HEAD~1 | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep this run's raw downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc-weekly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/h-*/
            ${{ runner.temp }}/careers/
            ${{ runner.temp }}/scan/*/SUMMARY.md
            ${{ runner.temp }}/find/raw.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Flag a failed competition check, player refresh or scan
        if: ${{ steps.find.outcome == 'failure' || steps.plan.outputs.find_ok != 'true' || steps.refresh.outcome == 'failure' || steps.scan.outcome == 'failure' }}
        run: |
          echo "::error::Results were published, but part of the run failed: competition check (${{ steps.find.outcome }}, list read ${{ steps.plan.outputs.find_ok }}), player refresh (${{ steps.refresh.outcome }}), new-id scan (${{ steps.scan.outcome }}). New seasons and/or players were not updated this run."
          exit 1
